services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mailmind
      POSTGRES_PASSWORD: mailmind
      POSTGRES_DB: mailmind
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmind"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      MAILMIND_ENV: prod
      MAILMIND_DATABASE_URL: postgresql+psycopg://mailmind:mailmind@db:5432/mailmind
      MAILMIND_REDIS_URL: redis://redis:6379/0
      MAILMIND_STORAGE_ROOT: /app/var/raw
      MAILMIND_MODEL_DIR: /app/var/models
      MAILMIND_API_KEY: ${MAILMIND_API_KEY:-}
      MAILMIND_SECRET_KEY: ${MAILMIND_SECRET_KEY:-change-me-in-production}
      MAILMIND_LLM_PROVIDER: ${MAILMIND_LLM_PROVIDER:-template}
      MAILMIND_LLM_API_KEY: ${MAILMIND_LLM_API_KEY:-}
      MAILMIND_AUTO_REPLY_SEND_MODE: review
    ports: ["8080:8080"]
    volumes: ["vardata:/app/var"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["celery", "-A", "mailmind.tasks.celery_app:celery_app", "worker", "-l", "info"]
    environment:
      MAILMIND_ENV: prod
      MAILMIND_CELERY_TASK_ALWAYS_EAGER: "false"
      MAILMIND_DATABASE_URL: postgresql+psycopg://mailmind:mailmind@db:5432/mailmind
      MAILMIND_REDIS_URL: redis://redis:6379/0
      MAILMIND_STORAGE_ROOT: /app/var/raw
      MAILMIND_MODEL_DIR: /app/var/models
    volumes: ["vardata:/app/var"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  vardata:
