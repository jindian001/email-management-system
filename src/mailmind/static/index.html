<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MailMind · 智能邮箱管理台</title>
<link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
<header>
  <h1>MailMind</h1>
  <span class="badge" id="mode">加载中…</span>
  <span class="badge" id="health">-</span>
  <span class="spacer"></span>
  <input id="apikey" placeholder="X-API-Key（未启用鉴权可留空）" style="max-width:240px" />
  <button class="act" id="refresh">刷新</button>
</header>

<main>
  <nav id="tabs">
    <button data-tab="overview">总览</button>
    <button data-tab="inbox">收件箱</button>
    <button data-tab="quarantine">隔离区</button>
    <button data-tab="review">自动回复审核</button>
    <button data-tab="accounts">账号</button>
    <button data-tab="rules">规则</button>
    <button data-tab="kb">知识库</button>
    <button data-tab="audit">审计</button>
    <button data-tab="feedback">反馈</button>
  </nav>
  <section id="view"><div class="card empty">加载中…</div></section>
</main>

<div id="modal-root"></div>
<div id="toast"></div>
<script src="/ui/app.js"></script>
</body>
</html>
